[project]
name = "mandivoice"
version = "1.0.0"
description = "MandiVoice - APMC Smart Voice Trading & Ledger System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
    "groq>=0.11.0",
]

[tool.vercel]
entrypoint = "api/index.py:app"
